services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    expose: ["8000"]
    volumes:
      - maxbot_data:/data
    tmpfs:
      - /run/maxbot-sessions:mode=0700,uid=10001,gid=10001,size=128m
      - /tmp:mode=1777,size=32m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt: ["no-new-privileges:true"]
    read_only: true
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt: ["no-new-privileges:true"]
volumes:
  maxbot_data:
  caddy_data:
  caddy_config:
